aid: ocsial
name: OCSiAl
description: >-
  OCSiAl is a Luxembourg-headquartered advanced-materials manufacturer and the world's largest
  industrial producer of single wall carbon nanotubes (graphene nanotubes), sold under the TUBALL
  brand. Founded in 2010, the company industrialised nanotube synthesis with its Graphetron reactors
  and now supplies TUBALL nanotubes, TUBALL MATRIX concentrates and TUBALL BATT dispersions as
  conductive and reinforcing additives to lithium-ion battery electrode, elastomer, thermoplastic,
  coating, composite and ESD-flooring producers. TUBALL was the first single wall carbon nanotube
  registered under EU REACH and covered by a US EPA consent order. OCSiAl operates production and
  dispersion facilities in Luxembourg and Serbia plus laboratories and TUBALL CENTERs in Europe and
  Asia, with commercial representation in more than 20 countries. It is a materials producer, not a
  software vendor, and publishes no public API, developer portal or SDK.
